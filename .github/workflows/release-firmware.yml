name: Release firmware

# Builds both boards' firmware and merges each into one flashable .bin (the
# format ESP Web Tools expects — bootloader + partition table + boot_app0 +
# app, all in one image at offset 0). Then:
#
#   1. On a tag push (v*): attaches both .bin files to that tag's GitHub
#      Release, for people who want to download them directly.
#   2. Always: copies both .bin files into docs/firmware/ on the default
#      branch, so GitHub Pages serves them next to the web flasher.
#
# Step 2 exists because browsers can't fetch release assets directly —
# GitHub's download servers send no CORS headers, so the web flasher fails
# with "Failed to fetch". Same-origin files on Pages avoid that entirely.
#
# You can also run this by hand (Actions tab -> Release firmware -> Run
# workflow) to rebuild the web flasher's firmware without making a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: meshnology_s3
            chip: esp32s3
            asset_name: mtg-life-counter-meshnology_s3.bin
          - env: diymalls_c3
            chip: esp32c3
            asset_name: mtg-life-counter-diymalls_c3.bin

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO and esptool
        run: pip install -U platformio esptool

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Locate boot_app0.bin
        id: bootapp0
        run: |
          path=$(find ~/.platformio -name boot_app0.bin | head -n1)
          if [ -z "$path" ]; then
            echo "boot_app0.bin not found under ~/.platformio" >&2
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Merge into one flashable image
        run: |
          BUILD_DIR=.pio/build/${{ matrix.env }}
          esptool.py --chip ${{ matrix.chip }} merge_bin \
            -o ${{ matrix.asset_name }} \
            --flash_mode keep --flash_freq keep --flash_size keep \
            0x0     "$BUILD_DIR/bootloader.bin" \
            0x8000  "$BUILD_DIR/partitions.bin" \
            0xe000  "${{ steps.bootapp0.outputs.path }}" \
            0x10000 "$BUILD_DIR/firmware.bin"

      - name: Keep the image for the web-flasher job
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          fail_on_unmatched_files: true

  publish-web-flasher:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Always work on the default branch (not the tag that triggered this
      # run) — that's the branch GitHub Pages serves /docs from.
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download both images
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: incoming
          merge-multiple: true

      - name: Copy into docs/firmware
        run: |
          mkdir -p docs/firmware
          cp incoming/mtg-life-counter-meshnology_s3.bin docs/firmware/
          cp incoming/mtg-life-counter-diymalls_c3.bin docs/firmware/
          ls -l docs/firmware

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/firmware
          if git diff --cached --quiet; then
            echo "Web flasher firmware already up to date."
            exit 0
          fi
          git commit -m "Update web flasher firmware (${GITHUB_REF_NAME})"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
