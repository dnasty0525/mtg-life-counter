; MTG Life Counter — PlatformIO project
; Two build targets, one shared codebase:
;   - meshnology_s3  : Meshnology ESP32-S3 1.28" 240x240 round, rotary knob input
;   - diymalls_c3    : DIYmalls ESP32-C3 1.28" 240x240 round, capacitive touch input
;
; Build with:   pio run -e meshnology_s3      (or diymalls_c3)
; Upload with:  pio run -e meshnology_s3 -t upload
; Monitor with: pio device monitor

[platformio]
default_envs = diymalls_c3

; ---------------------------------------------------------------------------
; Shared settings for every environment
; ---------------------------------------------------------------------------
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Table sync (src/net/table_sync.cpp) pulls in the WiFi/ESP-NOW stack,
; which pushed the firmware past the default partition scheme's ~1.25MB
; app slot (that scheme reserves two slots, for OTA updates this project
; doesn't use). huge_app.csv trades the second OTA slot for one ~3MB app
; partition instead — plenty of headroom, and needs no code changes.
; Needs a 4MB (or larger) flash chip, which both these boards have.
board_build.partitions = huge_app.csv
lib_deps =
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI@^2.5.43
    lovyan03/LovyanGFX@^1.1.16
    adafruit/Adafruit NeoPixel@^1.12.0
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -I boards
; display_test_main.cpp has its own setup()/loop() and must be excluded
; from every normal build (it's only compiled by the
; meshnology_s3_display_test env below, which overrides this filter to
; include only that one file). Without this, main.cpp's and
; display_test_main.cpp's setup()/loop() collide at link time.
build_src_filter = +<*> -<display_test_main.cpp>

; ---------------------------------------------------------------------------
; Meshnology ESP32-S3 round rotary-knob board
; ---------------------------------------------------------------------------
[env:meshnology_s3]
board = esp32-s3-devkitc-1
; NOTE: do NOT force board_build.flash_mode/psram_type here. An earlier
; version of this file set flash_mode=qio + psram_type=opi guessing at the
; ESP32-S3R8's octal PSRAM — that was wrong for this board's actual wiring
; and caused a hard boot loop (repeating ROM banner, RTC_SW_SYS_RST, never
; reaching setup()). The board's default flash mode is DIO (confirmed from
; an earlier successful boot log that ran all the way into the app), so we
; now leave flash/PSRAM config at the board profile's defaults.
build_flags =
    ${env.build_flags}
    -D BOARD_MESHNOLOGY_S3=1
    -D INPUT_ROTARY_ENCODER=1
    -D LV_HOR_RES_MAX=240
    -D LV_VER_RES_MAX=240
    -D CORE_DEBUG_LEVEL=1
    ; This board has no separate USB-serial chip — it uses the S3's own
    ; built-in USB peripheral. Without these two flags, Serial.begin()
    ; goes nowhere (not even the ROM boot banner shows up).
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; Meshnology/CrowPanel S3 bring-up test: raw LovyanGFX only, no LVGL, no
; touch, no encoder. Use this FIRST if the full firmware shows a blank
; screen — it isolates whether the panel/pins/flash config are good.
;   pio run -e meshnology_s3_display_test -t upload && pio device monitor
; ---------------------------------------------------------------------------
[env:meshnology_s3_display_test]
board = esp32-s3-devkitc-1
; src_dir is only settable in [platformio], not per-environment — using it
; here was silently ignored, which is why this "test" was actually just
; building src/main.cpp (the real firmware) the first time. The correct
; per-environment mechanism is build_src_filter: exclude everything in
; src/, then include only the one test file.
build_src_filter = -<*> +<display_test_main.cpp>
build_flags =
    ${env.build_flags}
    -D BOARD_MESHNOLOGY_S3=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; DIYmalls ESP32-C3 round touch board (ESP32-2424S012C-I-Y(B))
; ---------------------------------------------------------------------------
[env:diymalls_c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D BOARD_DIYMALLS_C3=1
    -D INPUT_TOUCH=1
    -D LV_HOR_RES_MAX=240
    -D LV_VER_RES_MAX=240
    -D CORE_DEBUG_LEVEL=1
